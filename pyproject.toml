[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-delta-estimator"
version = "0.1.0"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "mc_pricer",
    "path_simulator",
    "payoffs",
]

[tool.setuptools.packages.find]
where = ["src"]